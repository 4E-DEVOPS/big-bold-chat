plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.bigboldchat.ChatXLLauncher'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.bigboldchat'
version = '2.4.6'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

/*
 * RUN BIGBOLDCHAT
 */

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

/*
 * TEST TASKS
 */

tasks.withType(Test).configureEach {
	testLogging {
		showStandardStreams = true
	}
}

tasks.register('testAll') {
	group = 'verification'
	description = 'Runs all BigBoldChat deterministic test suites.'

	dependsOn(
			'testChat',
			'testChatbox',
			'testConfig',
			'testFonts',
	)
}

tasks.register('testChat', Test) {
	group = 'verification'
	description = 'Tests BigBoldChat chat construction measurement, semantic normalization, layout/correlation orchestration, rank recovery, and persistent row indexing.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	filter {
		includeTestsMatching 'com.bigboldchat.chat.ChatTextNormalizerTest'
		includeTestsMatching 'com.bigboldchat.chat.FontLayoutServiceTest'
		includeTestsMatching 'com.bigboldchat.chat.FontMeasurementServiceTest'
		includeTestsMatching 'com.bigboldchat.chat.RowCorrelationIndexTest'
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('testChatbox', Test) {
	group = 'verification'
	description = 'Tests BigBoldChat chatbox user interface.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	filter {
		includeTestsMatching 'com.bigboldchat.chatbox.ChatboxResizeServiceTest'
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('testConfig', Test) {
	group = 'verification'
	description = 'Tests BigBoldChat player-facing font names and RuneScape FontID mappings.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	filter {
		includeTestsMatching 'com.bigboldchat.config.ChatFontTest'
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('testFonts', Test) {
	group = 'verification'
	description = 'Tests BigBoldChat font registry resolution, default fallback behavior, and tuned font-profile geometry and spacing values.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	filter {
		includeTestsMatching 'com.bigboldchat.fonts.ChatFontRegistryTest'
		includeTestsMatching 'com.bigboldchat.fonts.ChatFontProfileTest'
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}
