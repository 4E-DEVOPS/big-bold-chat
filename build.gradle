plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.bigboldchat.ChatXLLauncher'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.bigboldchat'
version = '2.5.3'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

/*
 * RUN BIGBOLDCHAT
 */

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
    description = 'Builds a bundled ChatXL JAR with test launcher and runtime dependencies.'
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

/*
 * TEST TASKS
 */

tasks.withType(Test).configureEach {
	testLogging {
		showStandardStreams = true
	}
}

tasks.register('testAll') {
	group = 'verification'
	description = 'Runs all BigBoldChat deterministic unit-test suites.'

	dependsOn(
			'testChat',
			'testChatbox',
			'testConfig',
            'testDialogue',
			'testFonts',
            'testLayout',
	)
}

tasks.register('testChat', Test) {
	group = 'verification'
	description = 'Tests BigBoldChat chat construction measurement, semantic normalization, layout/correlation orchestration, rank recovery, and persistent row indexing.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	filter {
		includeTestsMatching 'com.bigboldchat.chat.ChatTextNormalizerTest'
		includeTestsMatching 'com.bigboldchat.chat.FontLayoutServiceTest'
		includeTestsMatching 'com.bigboldchat.chat.FontMeasurementServiceTest'
		includeTestsMatching 'com.bigboldchat.chat.RowCorrelationIndexTest'
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('testChatbox', Test) {
	group = 'verification'
	description = 'Tests BigBoldChat chatbox geometry, placement, native modes, center ownership, restoration, and core-service boundaries.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	filter {
        includeTestsMatching 'com.bigboldchat.chatbox.ChatboxCoreServiceTest'
        includeTestsMatching 'com.bigboldchat.chatbox.ChatboxGeometryTest'
        includeTestsMatching 'com.bigboldchat.chatbox.ChatboxPlacementTest'
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('testConfig', Test) {
	group = 'verification'
	description = 'Tests BigBoldChat font display names, ordering, and RuneScape font ID mappings.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	filter {
		includeTestsMatching 'com.bigboldchat.config.ChatFontTest'
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('testDialogue', Test) {
    group = 'verification'
    description = 'Tests BigBoldChat dialogue lifecycle, fitting, adaptive centering, collision recovery, clipping, and restoration.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnit()

    filter {
        includeTestsMatching 'com.bigboldchat.dialogue.DialogueCoreServiceTest'
        includeTestsMatching 'com.bigboldchat.dialogue.DialogueFitSolverTest'
        includeTestsMatching 'com.bigboldchat.dialogue.DialoguePromptsTest'
        includeTestsMatching 'com.bigboldchat.dialogue.DialogueResizeServiceTest'
        includeTestsMatching 'com.bigboldchat.dialogue.DialogueSessionTest'
        includeTestsMatching 'com.bigboldchat.dialogue.DialogueViewportTest'
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.register('testFonts', Test) {
	group = 'verification'
	description = 'Tests BigBoldChat font registry resolution, fallback behavior, and tuned per-font geometry and spacing profiles.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	filter {
		includeTestsMatching 'com.bigboldchat.fonts.ChatFontRegistryTest'
		includeTestsMatching 'com.bigboldchat.fonts.ChatFontProfileTest'
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('testLayout', Test) {
    group = 'verification'
    description = 'Tests BigBoldChat collision direction, canvas clipping, obstacle recovery, and minimum viewport geometry.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnit()

    filter {
        includeTestsMatching 'com.bigboldchat.layout.ChatboxBoundsTest'
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
